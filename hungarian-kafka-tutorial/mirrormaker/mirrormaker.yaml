apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: my-mirror-maker-2
spec:
  version: 3.9.0
  replicas: 1
  connectCluster: "my-cluster"  # A cél klaszter aliasa
  clusters:
    - alias: "other-cluster"  # Forrás klaszter
      bootstrapServers: other-cluster-kafka-bootstrap:9092
    - alias: "my-cluster"  # Cél klaszter
      bootstrapServers: my-cluster-kafka-bootstrap:9092
      config:
        config.storage.replication.factor: -1
        offset.storage.replication.factor: -1
        status.storage.replication.factor: -1
  mirrors:
    - sourceCluster: "other-cluster"
      targetCluster: "my-cluster"
      sourceConnector:
        tasksMax: 1
        config:
          # -1 means it will use the default replication factor configured in the broker
          replication.factor: -1
          offset-syncs.topic.replication.factor: -1
          sync.topic.acls.enabled: "true"
          refresh.topics.interval.seconds: 60
          offset.lag.max: 10000
          offset.flush.interval.ms: 10000
      checkpointConnector:
        tasksMax: 1
        config:
          # -1 means it will use the default replication factor configured in the broker
          checkpoints.topic.replication.factor: -1
          sync.group.offsets.enabled: "true"
          sync.group.offsets.interval.seconds: 60
          refresh.groups.interval.seconds: 60
      topicsPattern: ".*"
      groupsPattern: ".*"
