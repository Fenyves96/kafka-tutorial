apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ksqldb
  labels:
    app: ksqldb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksqldb
  template:
    metadata:
      labels:
        app: ksqldb
    spec:
      containers:
        - name: ksqldb
          image: confluentinc/cp-ksqldb-server:7.7.1
          env:
          - name: KSQL_LISTENERS
            value: http://0.0.0.0:8088
          - name: KSQL_BOOTSTRAP_SERVERS
            value: my-cluster-kafka-bootstrap:9092
          - name: KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE
            value: "true"
          - name: KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE
            value: "true"
          ports:
            - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: ksqldb
  labels:
    app: ksqldb
spec:
  selector:
    app: ksqldb
  ports:
    - protocol: TCP
      port: 8088
      targetPort: 8088
  type: LoadBalancer
